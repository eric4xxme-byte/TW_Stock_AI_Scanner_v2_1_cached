name: v2.16 Market Context + Background Learning Sync

on:
  workflow_dispatch:
    inputs:
      force_run:
        description: 'Force learning sync even outside Taiwan intraday/post-close window? Use 1 for manual test.'
        required: false
        default: '1'
        type: choice
        options:
          - '1'
          - '0'
  schedule:
    # Intraday learning: Taiwan 08:50-14:20 ~= UTC 00:50-06:20.
    - cron: '*/5 0-6 * * 1-5'
    # Post-close verification passes: Taiwan 13:30, 14:30, 16:00 ~= UTC 05:30, 06:30, 08:00.
    - cron: '30 5,6 * * 1-5'
    - cron: '0 8 * * 1-5'
    # Night / next-day risk context: Taiwan 15:00-04:30 ~= UTC 07:00-20:30.
    # This updates market/night context only; background_learning_sync.py skips journal outside its own window.
    - cron: '*/30 7-20 * * 1-5'

permissions:
  contents: write

concurrency:
  group: v216-market-context-learning-sync
  cancel-in-progress: true

jobs:
  v216-market-context-learning-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests

      - name: Pull latest data before sync
        run: |
          git pull --rebase origin main

      - name: Build v2.16 market / night context
        run: |
          python background_market_context.py

      - name: Run v2.16 background learning sync
        env:
          GSHEET_WEBHOOK_URL: ${{ secrets.GSHEET_WEBHOOK_URL }}
          BACKGROUND_POOL_LIMIT: '180'
          BACKGROUND_SYNC_LIMIT: '120'
          BACKGROUND_BATCH_SIZE: '20'
          FORCE_RUN: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.force_run || '0' }}
        run: |
          python background_learning_sync.py

      - name: Show generated v2.16 files
        run: |
          echo "=== data folder ==="
          ls -la data || true
          echo "=== v216 market context ==="
          cat data/v216_market_context.json || true
          echo "=== v216 night session context ==="
          cat data/v216_night_session_context.json || true
          echo "=== v215 background sync meta ==="
          cat data/v215_background_sync_meta.json || true
          echo "=== journal preview ==="
          python - <<'PY'
          import pandas as pd
          from pathlib import Path
          for name in ['data/v215_verified_signal_journal.csv', 'data/v216_market_context_history.csv']:
              p = Path(name)
              print('\n---', name, 'exists:', p.exists())
              if p.exists():
                  df = pd.read_csv(p, dtype=str)
                  print('rows:', len(df))
                  print('cols:', list(df.columns)[:12])
                  print(df.tail(3).to_string(index=False))
          PY

      - name: Commit updated v2.16 context and learning data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A \
            data/v215_verified_signal_journal.csv \
            data/v215_background_sync_meta.json \
            data/v216_market_context.json \
            data/v216_night_session_context.json \
            data/v216_post_close_verification.json \
            data/v216_market_context_history.csv
          echo "=== git status before commit ==="
          git status --short
          if git diff --cached --quiet; then
            echo "No v2.16 learning/context changes to commit."
          else
            git commit -m "chore: update v2.16 market context and learning data"
            git pull --rebase origin main
            git push
          fi
