name: v2.23.2 Limit-up Precursor Collector

on:
  workflow_dispatch:
    inputs:
      force_run:
        description: "Force run now"
        required: false
        default: "1"
  schedule:
    # UTC. Approx TW trading hours and post-close checks on weekdays.
    - cron: "*/10 1-6 * * 1-5"
    - cron: "30 7,8 * * 1-5"

permissions:
  contents: write

concurrency:
  group: v231-limitup-precursor-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy

      - name: Run v2.23.2 limit-up precursor collector
        run: |
          python background_limitup_collector.py

      - name: Show generated v2.23.2 files
        run: |
          echo "=== data directory ==="
          ls -la data || true
          echo "=== v231 meta ==="
          cat data/v231_limitup_precursor_meta.json || true
          echo "=== v231 csv head ==="
          python - <<'PY'
          import pandas as pd, os
          p='data/v231_limitup_precursor_features.csv'
          if os.path.exists(p):
              df=pd.read_csv(p)
              print('rows=', len(df), 'cols=', list(df.columns)[:12])
              print(df.head(10).to_string())
          else:
              print('missing', p)
          PY

      - name: Commit v2.23.2 precursor features
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A data/v231_limitup_precursor_features.csv data/v231_limitup_precursor_meta.json
          if git diff --cached --quiet; then
            echo "No v2.23.2 precursor changes to commit."
          else
            git commit -m "chore: update v2.23.2 limit-up precursor features"
            git pull --rebase origin main
            git push
          fi
