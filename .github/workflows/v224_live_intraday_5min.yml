name: v2.24.5 Live Intraday Auto Sync 5min + Google Sheet

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Max stock candidates to refresh"
        required: false
        default: "80"
      focus_codes:
        description: "Extra focus stock codes, comma separated"
        required: false
        default: "3441,2382,2313,6770,2409,3042,6257"
      sheet_sync_rows:
        description: "Max rows to sync to Google Sheet per run"
        required: false
        default: "120"
  schedule:
    # GitHub cron uses UTC. Taiwan = UTC+8.
    # Avoid minute 00 because GitHub can delay/drop scheduled jobs at high-load times.
    # TW 08:52, 08:57 pre-open warmup
    - cron: "52,57 0 * * 1-5"
    # TW 09:03-12:58 every 5 minutes
    - cron: "3-58/5 1-4 * * 1-5"
    # TW 13:03-13:33 every 5 minutes
    - cron: "3-33/5 5 * * 1-5"
    # TW 14:13 and 15:33 post-close verification snapshots
    - cron: "13 6 * * 1-5"
    - cron: "33 7 * * 1-5"

permissions:
  contents: write

env:
  TZ: Asia/Taipei
  LIVE_LIMIT_DEFAULT: "80"
  LIVE_FOCUS_CODES_DEFAULT: "3441,2382,2313,6770,2409,3042,6257"
  SHEET_SYNC_ROWS_DEFAULT: "120"

concurrency:
  group: v224-live-intraday-main
  cancel-in-progress: true

jobs:
  live-intraday:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests numpy python-dateutil pytz

      - name: Pull latest main first
        run: |
          git pull --rebase --autostash origin main || true
          mkdir -p data

      - name: Run live intraday engine
        env:
          LIVE_LIMIT: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.limit || env.LIVE_LIMIT_DEFAULT }}
          LIVE_FOCUS_CODES: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.focus_codes || env.LIVE_FOCUS_CODES_DEFAULT }}
        run: |
          python tw_live_engine.py --limit "${LIVE_LIMIT}" --focus-codes "${LIVE_FOCUS_CODES}"

      - name: Sync Google Sheet learning journal
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
          GSHEET_WEBHOOK_URL: ${{ secrets.GSHEET_WEBHOOK_URL }}
          FORCE_RUN: "1"
          BACKGROUND_POOL_LIMIT: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.limit || env.LIVE_LIMIT_DEFAULT }}
          BACKGROUND_SYNC_LIMIT: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.sheet_sync_rows || env.SHEET_SYNC_ROWS_DEFAULT }}
          BACKGROUND_BATCH_SIZE: "20"
        run: |
          if [ -f background_learning_sync.py ]; then
            echo "Running background_learning_sync.py to update v215 journal + Google Sheet..."
            timeout 170s python background_learning_sync.py || echo "Google Sheet sync failed/timeout; keep live CSV output and continue."
          else
            echo "background_learning_sync.py not found; skip Google Sheet sync."
          fi

      - name: Validate generated files
        run: |
          test -f data/live_intraday.csv
          test -f data/live_intraday_meta.json
          python - <<'PY'
          import json
          import pandas as pd
          from pathlib import Path
          meta = json.loads(Path('data/live_intraday_meta.json').read_text(encoding='utf-8'))
          df = pd.read_csv('data/live_intraday.csv', dtype=str)
          print(json.dumps(meta, ensure_ascii=False, indent=2))
          print('rows=', len(df), 'columns=', list(df.columns))
          assert len(df) >= 1, 'live_intraday.csv has no rows'
          assert '代號' in df.columns, 'missing 代號 column'
          assert '盤中現價' in df.columns, 'missing 盤中現價 column'
          PY
          if [ -f data/v215_background_sync_meta.json ]; then
            echo "=== Google Sheet sync meta ==="
            cat data/v215_background_sync_meta.json || true
          fi

      - name: Commit live data and learning journal
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data
          if git diff --cached --quiet; then
            echo "No live data or learning journal changes to commit."
            exit 0
          fi
          git commit -m "chore: v2.24.5 live intraday and sheet sync"
          git pull --rebase --autostash origin main || true
          git push origin HEAD:main
