name: v2.16.12 Auto Background Learning Sync

on:
  workflow_dispatch:
    inputs:
      force_run:
        description: "Force run even outside TW market session (1=yes, 0=no)"
        required: false
        default: "1"
      sync_rows:
        description: "Max rows to sync to Google Sheet per run"
        required: false
        default: "120"
  schedule:
    # GitHub cron uses UTC. Taiwan = UTC+8.
    # Taiwan 09:00-13:35, Mon-Fri, every 5 minutes.
    - cron: "*/5 1-5 * * 1-5"
    # Taiwan 14:10 post-close verification.
    - cron: "10 6 * * 1-5"
    # Taiwan 15:30 second verification.
    - cron: "30 7 * * 1-5"

permissions:
  contents: write

env:
  TZ: Asia/Taipei

concurrency:
  # Same workflow only. Do not cancel in-progress commit; we keep the whole job short instead.
  group: v21612-auto-background-learning-sync-${{ github.ref }}
  cancel-in-progress: false

jobs:
  auto-background-learning-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests python-dateutil pytz

      - name: Create run heartbeat start
        run: |
          mkdir -p data
          python - <<'PY'
          import json, os, datetime
          now_tw = datetime.datetime.now(datetime.timezone(datetime.timedelta(hours=8))).isoformat()
          obj = {
            "status": "running",
            "workflow_version": "v2.16.12",
            "event_name": os.environ.get("GITHUB_EVENT_NAME", ""),
            "run_id": os.environ.get("GITHUB_RUN_ID", ""),
            "run_number": os.environ.get("GITHUB_RUN_NUMBER", ""),
            "started_at_tw": now_tw,
            "completed_at_tw": "",
            "note": "If this file updates automatically every 5 minutes during TW market hours, background learning schedule is alive."
          }
          with open("data/v21612_auto_sync_heartbeat.json", "w", encoding="utf-8") as f:
            json.dump(obj, f, ensure_ascii=False, indent=2)
          PY

      - name: Pull latest before data generation
        run: |
          git pull --rebase --autostash origin main || true

      - name: Update market context with strict timeout
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: |
          if [ -f background_market_context.py ]; then
            echo "Running background_market_context.py with 45s timeout..."
            timeout 45s python background_market_context.py || echo "background_market_context.py timeout/fail; continue."
          else
            echo "background_market_context.py not found; skip."
          fi

      - name: Run background learning sync with strict timeout
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
          GSHEET_WEBHOOK_URL: ${{ secrets.GSHEET_WEBHOOK_URL }}
          FORCE_RUN: ${{ github.event.inputs.force_run || '0' }}
          MAX_SYNC_ROWS: ${{ github.event.inputs.sync_rows || '120' }}
        run: |
          if [ -f background_learning_sync.py ]; then
            echo "Running background_learning_sync.py with 150s timeout..."
            timeout 150s python background_learning_sync.py || echo "background_learning_sync.py timeout/fail; continue to commit heartbeat and data."
          else
            echo "background_learning_sync.py not found; skip."
          fi

      - name: Run limit-up precursor collector with strict timeout
        run: |
          if [ -f background_limitup_collector.py ]; then
            echo "Running background_limitup_collector.py with 45s timeout..."
            timeout 45s python background_limitup_collector.py || echo "background_limitup_collector.py timeout/fail; continue."
          else
            echo "background_limitup_collector.py not found; skip."
          fi

      - name: Create fallback files and heartbeat complete
        run: |
          python - <<'PY'
          import json, os, datetime
          os.makedirs("data", exist_ok=True)
          now_tw = datetime.datetime.now(datetime.timezone(datetime.timedelta(hours=8))).isoformat()
          # Preserve real generated files when present; only create missing fallbacks.
          defaults = {
            "data/v215_background_sync_meta.json": {"updated_at": now_tw, "status": "fallback_created_by_v21612", "sync": {"ok": False, "message": "fallback only; check workflow logs"}},
            "data/v216_market_context.json": {"updated_at": now_tw, "status": "fallback_created_by_v21612"},
            "data/v216_night_session_context.json": {"updated_at": now_tw, "status": "fallback_created_by_v21612"},
            "data/v231_limitup_precursor_meta.json": {"updated_at": now_tw, "status": "fallback_created_by_v21612"}
          }
          for p, obj in defaults.items():
            if not os.path.exists(p):
              with open(p, "w", encoding="utf-8") as f:
                json.dump(obj, f, ensure_ascii=False, indent=2)
          csv_path = "data/v231_limitup_precursor_features.csv"
          if not os.path.exists(csv_path):
            with open(csv_path, "w", encoding="utf-8") as f:
              f.write("date,time,code,name,price,pct,limitup_distance_pct,precursor_score,reason\n")
          heartbeat = {
            "status": "completed",
            "workflow_version": "v2.16.12",
            "event_name": os.environ.get("GITHUB_EVENT_NAME", ""),
            "run_id": os.environ.get("GITHUB_RUN_ID", ""),
            "run_number": os.environ.get("GITHUB_RUN_NUMBER", ""),
            "started_at_tw": "see previous commit/log",
            "completed_at_tw": now_tw,
            "note": "Auto schedule is alive if this file updates without manual Run workflow."
          }
          with open("data/v21612_auto_sync_heartbeat.json", "w", encoding="utf-8") as f:
            json.dump(heartbeat, f, ensure_ascii=False, indent=2)
          PY

      - name: Show sync diagnostics
        run: |
          echo "=== heartbeat ==="
          cat data/v21612_auto_sync_heartbeat.json || true
          echo "=== v215 sync meta ==="
          cat data/v215_background_sync_meta.json || true
          echo "=== v231 precursor meta ==="
          cat data/v231_limitup_precursor_meta.json || true

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data
          if git diff --cached --quiet; then
            echo "No data changes to commit."
            exit 0
          fi
          git commit -m "chore: v2.16.12 auto background learning sync"
          git pull --rebase --autostash origin main
          git push origin main
