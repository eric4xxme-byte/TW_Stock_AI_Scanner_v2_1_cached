name: v2.16.10 Fast Background Learning Sync

on:
  workflow_dispatch:
    inputs:
      force_run:
        description: "Force run even outside TW market session (1=yes, 0=no)"
        required: false
        default: "1"
      sync_rows:
        description: "Max rows to sync to Google Sheet per run"
        required: false
        default: "120"
  schedule:
    # Taiwan time UTC+8
    # 09:00-13:55 Mon-Fri, every 5 minutes
    - cron: "*/5 1-5 * * 1-5"
    # 14:10 post-close verification
    - cron: "10 6 * * 1-5"
    # 15:30 second post-close verification
    - cron: "30 7 * * 1-5"

permissions:
  contents: write

concurrency:
  group: v216-background-learning-sync-${{ github.ref }}
  cancel-in-progress: true

jobs:
  v216-fast-background-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 7

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests python-dateutil pytz

      - name: Prepare data folder
        run: |
          mkdir -p data
          echo "Run started at $(date -u '+%Y-%m-%d %H:%M:%S UTC')"

      - name: Update market context with hard timeout
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: |
          if [ -f background_market_context.py ]; then
            echo "Running background_market_context.py with 90s timeout..."
            timeout 90s python background_market_context.py || echo "background_market_context.py timed out or failed; continue."
          else
            echo "background_market_context.py not found; skip."
          fi

      - name: Run background learning sync with hard timeout
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
          GSHEET_WEBHOOK_URL: ${{ secrets.GSHEET_WEBHOOK_URL }}
          FORCE_RUN: ${{ github.event.inputs.force_run || '0' }}
          MAX_SYNC_ROWS: ${{ github.event.inputs.sync_rows || '120' }}
        run: |
          if [ -f background_learning_sync.py ]; then
            echo "Running background_learning_sync.py with 240s timeout..."
            timeout 240s python background_learning_sync.py || echo "background_learning_sync.py timed out or failed; continue to commit any generated files."
          else
            echo "background_learning_sync.py not found; skip."
          fi

      - name: Run limit-up precursor collector with hard timeout
        run: |
          if [ -f background_limitup_collector.py ]; then
            echo "Running background_limitup_collector.py with 90s timeout..."
            timeout 90s python background_limitup_collector.py || echo "background_limitup_collector.py timed out or failed; continue."
          else
            echo "background_limitup_collector.py not found; skip."
          fi

      - name: Ensure optional v2 data files exist
        run: |
          python - <<'PY'
          import json, os, datetime
          os.makedirs('data', exist_ok=True)
          now = datetime.datetime.now(datetime.timezone.utc).isoformat()
          defaults = {
            'data/v215_background_sync_meta.json': {'updated_at': now, 'status': 'fallback_created_by_v21610', 'sync': {'ok': False, 'message': 'fallback only; check workflow logs'}},
            'data/v216_market_context.json': {'updated_at': now, 'status': 'fallback_created_by_v21610'},
            'data/v216_night_session_context.json': {'updated_at': now, 'status': 'fallback_created_by_v21610'},
            'data/v216_post_close_verification.json': {'updated_at': now, 'status': 'fallback_created_by_v21610'},
            'data/v231_limitup_precursor_meta.json': {'updated_at': now, 'status': 'fallback_created_by_v21610'},
          }
          for p, obj in defaults.items():
            if not os.path.exists(p):
              with open(p, 'w', encoding='utf-8') as f:
                json.dump(obj, f, ensure_ascii=False, indent=2)
          # create CSV header if collector file missing
          csv_path = 'data/v231_limitup_precursor_features.csv'
          if not os.path.exists(csv_path):
            with open(csv_path, 'w', encoding='utf-8') as f:
              f.write('date,time,code,name,price,pct,limitup_distance_pct,precursor_score,reason\n')
          PY

      - name: Show generated files
        run: |
          echo "=== data folder ==="
          ls -la data | sed -n '1,200p'
          echo "=== v215 sync meta ==="
          cat data/v215_background_sync_meta.json || true
          echo "=== v216 market context ==="
          cat data/v216_market_context.json || true
          echo "=== v231 precursor meta ==="
          cat data/v231_limitup_precursor_meta.json || true

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git status --short
          git add -A data
          if git diff --cached --quiet; then
            echo "No data changes to commit."
            exit 0
          fi
          git commit -m "chore: v2.16.10 fast background sync data"
          git pull --rebase --autostash origin main
          git push origin main
