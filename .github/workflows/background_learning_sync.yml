name: v2.16.13 Strict Auto Background Learning Sync

on:
  workflow_dispatch:
    inputs:
      force_run:
        description: "Force run even outside TW market session (1=yes, 0=no)"
        required: false
        default: "1"
      sync_rows:
        description: "Max rows to sync to Google Sheet per run"
        required: false
        default: "120"
  schedule:
    # GitHub cron is UTC. Taiwan = UTC+8.
    # TW 09:00-12:55 Mon-Fri, every 5 minutes.
    - cron: "*/5 1-4 * * 1-5"
    # TW 13:00-13:35 Mon-Fri, every 5 minutes.
    - cron: "0-35/5 5 * * 1-5"
    # TW 14:10 post-close verification.
    - cron: "10 6 * * 1-5"
    # TW 15:30 second verification.
    - cron: "30 7 * * 1-5"

permissions:
  contents: write

env:
  TZ: Asia/Taipei
  MAX_SYNC_ROWS_DEFAULT: "120"

concurrency:
  group: v21613-strict-auto-background-learning-sync-main
  cancel-in-progress: true

jobs:
  auto-background-learning-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 4

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests python-dateutil pytz

      - name: Pull latest data
        run: |
          git pull --rebase --autostash origin main || true
          mkdir -p data

      - name: Start heartbeat
        run: |
          python - <<'PY'
          import json, os, datetime
          now = datetime.datetime.now(datetime.timezone(datetime.timedelta(hours=8))).isoformat()
          obj = {
            "status": "running",
            "workflow_version": "v2.16.13",
            "event_name": os.environ.get("GITHUB_EVENT_NAME", ""),
            "run_id": os.environ.get("GITHUB_RUN_ID", ""),
            "run_number": os.environ.get("GITHUB_RUN_NUMBER", ""),
            "started_at_tw": now,
            "completed_at_tw": "",
            "auto_schedule": "TW Mon-Fri 09:00-13:35 every 5 min; 14:10 and 15:30 verification",
            "note": "If this file updates by schedule without pressing Run workflow, auto learning is alive."
          }
          open("data/v21613_auto_sync_heartbeat.json", "w", encoding="utf-8").write(json.dumps(obj, ensure_ascii=False, indent=2))
          PY

      - name: Run market context with hard timeout
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: |
          if [ -f background_market_context.py ]; then
            timeout 35s python background_market_context.py || echo "market context timeout/fail; continue"
          else
            echo "background_market_context.py not found; skip"
          fi

      - name: Run background learning sync with hard timeout
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
          GSHEET_WEBHOOK_URL: ${{ secrets.GSHEET_WEBHOOK_URL }}
          FORCE_RUN: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.force_run || '1' }}
          MAX_SYNC_ROWS: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.sync_rows || '120' }}
        run: |
          if [ -f background_learning_sync.py ]; then
            timeout 130s python background_learning_sync.py || echo "background learning sync timeout/fail; continue"
          else
            echo "background_learning_sync.py not found; skip"
          fi

      - name: Run limit-up precursor collector with hard timeout
        run: |
          if [ -f background_limitup_collector.py ]; then
            timeout 35s python background_limitup_collector.py || echo "limit-up collector timeout/fail; continue"
          else
            echo "background_limitup_collector.py not found; skip"
          fi

      - name: Complete heartbeat and fallback diagnostics
        run: |
          python - <<'PY'
          import json, os, datetime
          os.makedirs("data", exist_ok=True)
          now = datetime.datetime.now(datetime.timezone(datetime.timedelta(hours=8))).isoformat()
          heartbeat = {
            "status": "completed",
            "workflow_version": "v2.16.13",
            "event_name": os.environ.get("GITHUB_EVENT_NAME", ""),
            "run_id": os.environ.get("GITHUB_RUN_ID", ""),
            "run_number": os.environ.get("GITHUB_RUN_NUMBER", ""),
            "completed_at_tw": now,
            "auto_schedule": "TW Mon-Fri 09:00-13:35 every 5 min; 14:10 and 15:30 verification",
            "note": "This heartbeat is written every run. Schedule is working only if this updates without manual Run workflow."
          }
          open("data/v21613_auto_sync_heartbeat.json", "w", encoding="utf-8").write(json.dumps(heartbeat, ensure_ascii=False, indent=2))
          # Keep old heartbeat path too, so front-end / human checks do not miss it.
          open("data/v21612_auto_sync_heartbeat.json", "w", encoding="utf-8").write(json.dumps(heartbeat, ensure_ascii=False, indent=2))
          for p, obj in {
            "data/v215_background_sync_meta.json": {"updated_at": now, "status": "fallback_by_v21613", "sync": {"ok": False, "message": "fallback only; check logs"}},
            "data/v231_limitup_precursor_meta.json": {"updated_at": now, "status": "fallback_by_v21613"}
          }.items():
            if not os.path.exists(p):
              open(p, "w", encoding="utf-8").write(json.dumps(obj, ensure_ascii=False, indent=2))
          if not os.path.exists("data/v231_limitup_precursor_features.csv"):
            open("data/v231_limitup_precursor_features.csv", "w", encoding="utf-8").write("date,time,code,name,price,pct,limitup_distance_pct,precursor_score,reason\n")
          PY

      - name: Show diagnostics
        run: |
          echo "=== v21613 heartbeat ==="
          cat data/v21613_auto_sync_heartbeat.json || true
          echo "=== v215 sync meta ==="
          cat data/v215_background_sync_meta.json || true
          echo "=== v231 precursor meta ==="
          cat data/v231_limitup_precursor_meta.json || true

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data
          if git diff --cached --quiet; then
            echo "No data changes to commit."
            exit 0
          fi
          git commit -m "chore: v2.16.13 strict auto background learning sync data"
          git pull --rebase --autostash origin main || true
          git push origin main
