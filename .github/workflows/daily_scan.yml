name: Daily Taiwan Stock AI Scan

on:
  workflow_dispatch:
  schedule:
    - cron: "30 10 * * 1-5"

permissions:
  contents: write

concurrency:
  group: daily-stock-scan
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Sync latest main before scan
        run: |
          git pull --rebase origin main

      - name: Run scanner and backtest
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: |
          python scanner_daily.py --limit 30 --chip-limit 10
          python backtest_daily.py --top-n 10 --horizons 1,3,5

      - name: Commit generated data
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add data/

          if git diff --cached --quiet; then
            echo "No generated data changes to commit"
          else
            git commit -m "Update stock scan and backtest data"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
